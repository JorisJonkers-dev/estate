# Loki in single-binary mode on its own claim, with the settings fleet-infra's
# loki chart renders today (its `loki` ConfigMap, read 2026-10-29), less what
# only a chart deployment needs: the memberlist ring (one replica), the
# gateway, and the runtime-config file the chart mounts empty.
auth_enabled: false
common:
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
index_gateway:
  mode: simple
limits_config:
  max_cache_freshness_per_query: 10m
  query_timeout: 300s
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  split_queries_by_interval: 15m
  volume_enabled: true
pattern_ingester:
  enabled: false
query_range:
  align_queries_with_step: true
ruler:
  storage:
    type: local
  wal:
    dir: /var/loki/ruler-wal
schema_config:
  configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: index_
      object_store: filesystem
      schema: v13
      store: tsdb
server:
  grpc_listen_port: 9095
  http_listen_port: 3100
  http_server_read_timeout: 600s
  http_server_write_timeout: 600s
storage_config:
  bloom_shipper:
    working_directory: /var/loki/data/bloomshipper
tracing:
  enabled: false
