# The Secret Store as Project Intent: the Application the Platform
# document's `secretStore` names (deploy-kit spec/v1/14-platform-intent.md#the-secret-store),
# and the Vault Secrets Operator that syncs every grant out of it.
#
# Every grant in the estate is read from it, so every Process holding one
# egresses to its `http` surface, and every Application holding one is ordered
# after this Project's unit.
#
# Started from deploy-kit's worked example (spec/v1/examples/secrets/) and
# brought to what fleet-infra runs, read 2026-10-29 from
# cluster/flux/apps/data/vault and cluster/flux/apps/core/vso and the live
# objects. Vault moves from data-system to secrets-system by raft snapshot and
# restore in a planned window, never a Move (JorisJonkers-dev/deploy-kit#663,
# decided 2026-10-27): docs/runbooks/secrets-handover.md.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: secrets # the namespace derives: secrets-system
owner: joris

applications:
  - id: vault
    description: The estate's Secret Store, one raft server holding every grant, policy and auth role.

    # Its metrics, scraped without a token: see config/vault.hcl.
    observability:
      scrape:
        process: vault
        surface: http
        path: /v1/sys/metrics

    # The UI and the CLI's OIDC sign-in, behind forward-auth, on the live host.
    exposure:
      - name: ui
        host: vault.jorisjonkers.dev
        audience: authenticated
        routes:
          - { path: /, match: prefix, process: vault, surface: http }

    processes:
      - name: vault
        lifecycle: application
        image: vault
        runtime: none
        # The image's own arguments are `server -dev`: an in-memory, unsealed
        # server with a root token in its log. The server runs from its
        # configuration instead, and without the image's entrypoint, which
        # tries setcap and chown as root.
        command: [vault]
        args: [server, -config=/vault/config/vault.hcl]
        provides:
          http: 8200
        placement:
          # 132Mi in use live (2026-10-29); a snapshot restore holds the
          # snapshot in memory beside the running store.
          memory: 512Mi
          cpu: 100m
          # The raft volume is local-path, bound to the node it is created on.
          # Live Vault runs at Frankfurt, which also holds every other
          # database the estate backs up from.
          site: frankfurt
        probes:
          # Sealed or uninitialised answers 503 or 501: not ready.
          readiness: { path: /v1/sys/health, port: 8200 }
          # A sealed server is alive. A health check that failed while sealed
          # would restart it, and every restart seals it again, so the person
          # unsealing it would race the probe.
          liveness: { tcp: 8200 }
        startupBudget: 30s
        cutover: interrupted # one server on a ReadWriteOnce claim
        # The raft store: every KV document, policy, role, lease and engine
        # configuration. A restart seals it until a person unseals it
        # (JorisJonkers-dev/estate#210).
        volumes:
          - claim: vault-data
            mountAt: /vault/data
            size: 10Gi
            durability: irreplaceable
        # `files` is the only method the model offers, and it copies the raft
        # files while the server writes them. A raft snapshot is the method
        # that is consistent; deploy-kit has no engine for it yet
        # (JorisJonkers-dev/deploy-kit#734; decision D4 in
        # docs/runbooks/secrets-handover.md).
        engine: files
        assets:
          - from: config/vault.hcl
            mountAt: /vault/config/vault.hcl
        # A snapshot restore stages the snapshot in /tmp before installing it,
        # and fails on a read-only one (rehearsed 2026-10-29 under this
        # posture). The live snapshot is about 16Mi, inside the 64Mi a writable
        # path gets. A writable /tmp is also HOME (deploy-kit 1.3.1), where the
        # CLI a person runs in the pod keeps its token.
        writablePaths: [/tmp]
        # The kubernetes auth method keeps no reviewer token: Vault reviews
        # every login with its own ServiceAccount token, which is how every
        # Process in the estate, and VSO for each of them, signs in.
        api:
          reason: >-
            Vault's kubernetes auth method reviews each login's ServiceAccount token with Vault's own, so every Process in the estate can sign in
          rules:
            - group: authentication.k8s.io
              objects: [tokenreviews]
              verbs: [create]
        # What Vault's engines connect to, configured in Vault itself: the
        # rabbitmq engine's management API. It orders nothing: RabbitMQ holds
        # grants, so it already runs after this Project. The database engine's
        # two Postgres connections (data's and immich's) are not edges: an
        # edge into a `postgres` derives a database for its consumer, which
        # Vault has none of, so their egress is missing from the render-only
        # policies (JorisJonkers-dev/deploy-kit#737).
        dependsOn:
          - { application: platform-rabbitmq, surface: management, required: false }

  # The Vault Secrets Operator: every grant's sync object is its, so it reads
  # them and writes the Secrets they land in, in every namespace. No agent
  # injector and no CSI provider run beside Vault.
  - id: vault-secrets-operator
    description: Syncs every grant out of Vault into the Secret its Process reads, and restarts that Process when the value changes.
    processes:
      - name: vault-secrets-operator
        lifecycle: application
        image: vault-secrets-operator
        runtime: none
        # The live chart's arguments, less two. `--leader-elect` is gone: one
        # replica elects nothing, and the lease it renews every 5s is what
        # lost VSO its leadership on the Pis. `--client-cache-persistence-model`
        # is gone: persisting the client cache needs a VaultAuth labelled for
        # the cache's transit key, which the model renders for no Process, so
        # a restart re-issues each dynamic credential and restarts its consumer
        # (JorisJonkers-dev/deploy-kit#735; decision D2 in
        # docs/runbooks/secrets-handover.md).
        args:
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8080
          - --global-vault-auth-options=allow-default-globals
          - --backoff-initial-interval=5s
          - --backoff-max-interval=60s
          - --backoff-max-elapsed-time=0s
          - --backoff-multiplier=1.50
          - --backoff-randomization-factor=0.50
          - --zap-log-level=info
          - --zap-time-encoding=rfc3339
          - --zap-stacktrace-level=panic
        provides:
          metrics: 8080
          health: 8081
        placement:
          # 40Mi in use live (2026-10-29).
          memory: 128Mi
          cpu: 50m
        probes:
          readiness: { path: /readyz, port: 8081 }
          liveness: { path: /healthz, port: 8081 }
        startupBudget: 30s
        cutover: interrupted
        # The live manager role (ClusterRole vault-secrets-operator-manager-role),
        # less `deletecollection` on Secrets, which the model's verbs do not
        # name, and Argo Rollouts, which the estate does not run. The operator
        # starts a controller for every kind of its own group, and one it may
        # not list never syncs its cache, so all ten are named.
        api:
          reason: >-
            the operator syncs every grant's sync object into its Secret, cluster-wide, and restarts the Processes a rotation names
          rules:
            - group: secrets.hashicorp.com
              objects: [vaultstaticsecrets, vaultdynamicsecrets, vaultpkisecrets, vaultauths, vaultauthglobals, vaultconnections, hcpauths, hcpvaultsecretsapps, secrettransformations, csisecrets]
              verbs: [get, list, watch, create, update, patch, delete]
            - group: secrets.hashicorp.com
              objects: [vaultstaticsecrets/status, vaultdynamicsecrets/status, vaultpkisecrets/status, vaultauths/status, vaultauthglobals/status, vaultconnections/status, hcpauths/status, hcpvaultsecretsapps/status, secrettransformations/status, csisecrets/status]
              verbs: [get, update, patch]
            - group: secrets.hashicorp.com
              objects: [vaultstaticsecrets/finalizers, vaultdynamicsecrets/finalizers, vaultpkisecrets/finalizers, vaultauths/finalizers, vaultauthglobals/finalizers, vaultconnections/finalizers, hcpauths/finalizers, hcpvaultsecretsapps/finalizers, secrettransformations/finalizers, csisecrets/finalizers]
              verbs: [update]
            - group: core
              objects: [secrets]
              verbs: [get, list, watch, create, update, patch, delete]
            - group: core
              objects: [serviceaccounts/token]
              verbs: [get, list, watch, create]
            - group: core
              objects: [configmaps, serviceaccounts]
              verbs: [get, list, watch]
            - group: apps
              objects: [deployments, statefulsets, daemonsets]
              verbs: [get, list, watch, patch]
            - group: core
              objects: [events]
              verbs: [create, patch]
