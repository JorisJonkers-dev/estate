# deploy-kit Project Intent for packages, the estate's package proxy at packages.jorisjonkers.dev
# (JorisJonkers-dev/estate#334, part of JorisJonkers-dev/workspace#167).
#
# It runs git-pkgs/proxy, a pull-through proxy for Maven, the Gradle Plugin Portal, Go, npm,
# PyPI and Cargo that never lists or serves a version published less than 7 days ago, and for
# container images (Docker Hub, ghcr.io, gcr.io, quay.io), Alpine and Debian packages, which
# the proxy's cooldown does not cover. Go and Gradle have no client-side minimum release age,
# so their builds resolve through it. The image
# is JorisJonkers-dev/packages-proxy's build of a pinned git-pkgs/proxy release with the
# estate's patches. This file publishes with the Platform document, on this repository's
# releases, and its image is in images.lock.yml.
#
# git-pkgs/proxy has no authentication of its own. Until identity's Gate takes over this host
# (a `gated` Client, identity#174 and identity#175), a Traefik sidecar checks an API key on every
# request and is the only listener the exposure reaches. See config/gate.yml.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: packages # the namespace derives: packages-system
owner: joris

applications:
  - id: packages
    exposure:
      - name: public
        host: packages.jorisjonkers.dev
        # CI runs on GitHub-hosted runners, so the proxy must be reachable from the internet.
        # Package managers cannot pass forward-auth, so the edge lets every request through and
        # the gate sidecar checks the API key. This becomes `authenticated` with a `gated`
        # Client once identity's Gate takes Personal Tokens and Machine Identity tokens here.
        audience: anonymous
        # Past Cloudflare: artifacts such as large wheels and JDK-sized jars are not web pages,
        # and Cloudflare's response-time limit would cut slow first fetches from upstream.
        proxied: false
        routes:
          - { path: /, match: prefix, process: proxy, surface: http }

    processes:
      - name: proxy
        lifecycle: application
        image: git-pkgs-proxy # ghcr.io/jorisjonkers-dev/packages-proxy; the lock resolves digest, uid and gid
        runtime: none
        args: [serve, -config, /etc/proxy/config.yaml]

        # The gate listens on 8081 and is the only port a Service exposes. The proxy itself
        # listens on 127.0.0.1:8080, which only the pod's own containers reach.
        provides:
          http: 8081

        sidecars:
          - name: gate
            image: traefik # the edge's own Traefik image, v3.7.12
            # 96Mi was OOMKilled under the parallel CI builds of the proxy rollout: every
            # streamed artifact holds buffers in the gate. 256Mi leaves room for that.
            memory: 256Mi
            cpu: 100m
            args: [--configFile=/etc/traefik/traefik.yml]
            assets:
              - { from: config/traefik.yml, mountAt: /etc/traefik/traefik.yml }
              - { from: config/gate.yml, mountAt: /etc/traefik/gate.yml }

          # Serves Cargo's config.json in place of the proxy's. The proxy's version lacks
          # `"auth-required": true`, and without it Cargo sends the key to the index but not to
          # crate downloads, which the gate then refuses with 401. The gate routes only
          # /cargo/config.json here, and only with a key. It listens on loopback.
          - name: cargo-config
            image: busybox # docker.io/library/busybox 1.37.0
            memory: 16Mi
            cpu: 10m
            command: [httpd]
            args: [-f, -p, "127.0.0.1:8082", -h, /srv/cargo]
            assets:
              - { from: config/cargo-config.json, mountAt: /srv/cargo/config.json }

        # Every Asset is the Process's, so the sidecars' files are mounted in the proxy's container
        # too, where nothing reads them; each sidecar mounts its own where it looks.
        assets:
          - from: config/proxy.yaml
            mountAt: /etc/proxy/config.yaml
          - from: config/traefik.yml
            mountAt: /etc/gate/traefik.yml
          - from: config/gate.yml
            mountAt: /etc/gate/gate.yml
          - from: config/cargo-config.json
            mountAt: /etc/gate/cargo-config.json

        secrets:
          # The API keys the gate accepts, one per kind of caller, generated by the Vault policy
          # job. A new key is a new entry here, in env/proxy/base.env and in config/gate.yml. A
          # leaked key: delete it in Vault, wait for the job to generate it again, then restart
          # the pod, because the gate reads its keys only at start.
          - path: secret/data/packages-system/keys
            keys:
              - name: ci
                generate: { bytes: 32, encoding: hex }
              - name: workstation
                generate: { bytes: 32, encoding: hex }
            access: read
            # The env file reaches every container of the pod, so the proxy holds the keys
            # too. It never reads or shows them: no endpoint of git-pkgs/proxy exposes its
            # environment.
            delivery: env
            rotation: { tolerates: restart }

        # The cache: artifacts, cached metadata and the SQLite database with the publish times
        # the cooldown reads. Losing it costs refetching from upstream, nothing else.
        volumes:
          - claim: packages-cache
            mountAt: /data
            size: 100Gi
            durability: reconstructible

        # The Frankfurt node: the only one on the public tier, with 352GiB of SSD.
        # Full npm packuments are held in memory while they are filtered, up to 200MB each.
        placement:
          memory: 1Gi
          cpu: 200m
          site: frankfurt

        writablePaths: [/tmp]

        egress: { to: internet, reason: fetches packages and their metadata from the public registries }

        # Through the gate's `ready` route (config/gate.yml) to the proxy's /health: it exists
        # only when the gate loaded its keys, and answers 200 only while the proxy's database
        # and storage work. The proxy listens on loopback, so no probe can reach it directly.
        # /health caches its storage round-trip for 30 seconds, so a probe rarely waits on it.
        probes:
          readiness: { path: /.gate/ready, port: 8081 }
          liveness: { path: /.gate/ready, port: 8081 }

        startupBudget: 60s

        # One pod holds the volume, so a new version replaces the old one.
        cutover: interrupted
