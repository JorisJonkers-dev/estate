# The Secret Store as Project Intent: the Application the Platform
# document's `secretStore` names (deploy-kit spec/v1/14-platform-intent.md#the-secret-store).
#
# Every grant in the estate is read from it, so every Process holding one
# egresses to its `http` surface, and every Application holding one is ordered
# after the unit that materialises the credentials it asks for.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: secrets # the namespace derives: secrets-system
owner: joris

applications:
  - id: vault
    processes:
      - name: vault
        lifecycle: application
        image: vault
        runtime: none
        provides:
          http: 8200
        placement:
          memory: 256Mi
          cpu: 100m
        probes:
          readiness: { path: /v1/sys/health, port: 8200 }
          liveness: { path: /v1/sys/health, port: 8200 }
        startupBudget: 30s
        cutover: interrupted
