# postgres-exporter's custom queries, read through PG_EXPORTER_EXTEND_QUERY_PATH.
#
# pg_database_collation_drifted is 1 for a database whose recorded collation
# version differs from the C library's. Its text indexes may then be sorted in
# an order the library no longer uses, so lookups silently miss rows. A
# database created before collation versions were recorded has none, which
# counts as drift. REINDEX, then ALTER DATABASE ... REFRESH COLLATION VERSION.
pg_database_collation:
  query: >-
    SELECT datname,
    CASE WHEN datcollversion IS DISTINCT FROM pg_database_collation_actual_version(oid)
    THEN 1 ELSE 0 END AS drifted
    FROM pg_database WHERE datallowconn AND NOT datistemplate
  metrics:
    - datname:
        usage: LABEL
        description: Database name.
    - drifted:
        usage: GAUGE
        description: 1 when the recorded collation version differs from the C library's.

