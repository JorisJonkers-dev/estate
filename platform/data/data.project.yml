# deploy-kit Project Intent for the estate's shared datastores: Postgres, RabbitMQ, Valkey,
# Garage and MongoDB.
#
# The Project is `data`, so the namespace derives as `data-system`, where all of them already
# run. MongoDB, Overleaf's document store, joined after the other four, in its own handover
# (JorisJonkers-dev/deploy-kit#748, docs/runbooks/mongo-handover.md).
# It is on the estate path since JorisJonkers-dev/deploy-kit#661
# (deploy-kit docs/runbooks/handover.md): its pin delivers it, and its unit applies the Postgres
# catalog. It publishes with the Platform document, on this repository's releases, and its
# images are in images.lock.yml.
#
# Each value below is read from the live objects. Every live claim keeps its name, so the
# handover adopts it in place. Where the old path does something the model derives instead, or
# cannot say yet, the comment says so. The render-against-live diff, and what the old path
# keeps, is in docs/runbooks/data-handover.md.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: data # the namespace derives: data-system
owner: joris

applications:
  - id: platform-postgres
    observability:
      scrape:
        process: postgres
        surface: metrics
        path: /metrics

    processes:
      - name: postgres
        lifecycle: application
        image: postgres # pgvector/pgvector:pg17; the lock resolves digest, uid and gid
        runtime: none
        engine: postgres # keys the backup method and the database catalog

        # The live server reads its tuned config from where the old path mounts it, never from
        # the data directory, where initdb writes its own copy. The image's entrypoint runs
        # `postgres` before arguments that start with a dash.
        args: [-c, config_file=/etc/postgresql/postgresql.conf]

        provides:
          postgres: 5432
          metrics: 9187 # the exporter sidecar's listener

        # The live pod requests 1536Mi and is limited at 4Gi; the model sets request to limit.
        placement:
          memory: 4Gi
          cpu: 300m

        writablePaths: [/var/run/postgresql, /tmp]

        # As live: the exporter beside Postgres, dialling it on localhost with the superuser,
        # and reading the custom queries behind the PostgresCollationDrift alert.
        sidecars:
          - name: postgres-exporter
            image: postgres-exporter
            memory: 128Mi
            cpu: 25m
            args: [--extend.query-path=/etc/postgres-exporter/queries.yaml]
            assets:
              - from: config/postgres-exporter-queries.yaml
                mountAt: /etc/postgres-exporter/queries.yaml

        # The live probes run pg_isready on the socket; the model has tcp and http probes only,
        # so a wedged postmaster that keeps its listener open reads as healthy. PostgresDown
        # (pg_up == 0, from the exporter) still reports it.
        probes:
          readiness: { tcp: 5432 }
          liveness: { tcp: 5432 }

        startupBudget: 600s # the live startup probe allows 60 checks 10s apart

        cutover: interrupted # one pod on a ReadWriteOnce claim

        volumes:
          - claim: postgres-data
            mountAt: /var/lib/postgresql/data
            size: 20Gi
            durability: irreplaceable

        # The live init script that creates each database is not here: an executable is never
        # an Asset, it runs only on an empty data directory, and the database catalog derives
        # those databases from the inbound edges
        # (deploy-kit spec/v1/16-dependencies.md#the-database-catalog).
        assets:
          - from: config/postgresql.conf
            mountAt: /etc/postgresql/postgresql.conf
          - from: config/postgres-exporter-queries.yaml
            mountAt: /etc/postgres-exporter/queries.yaml

        # The superuser, for the server's first start and the exporter. The old path's init
        # script also read the static auth, agents and kb logins from this document; each
        # consumer that still signs in with one holds its own grant on it.
        secrets:
          - path: secret/data/platform/postgres
            keys: [postgres.user, postgres.password]
            access: read
            delivery: env
            rotation: { tolerates: restart }

  - id: platform-rabbitmq
    observability:
      scrape:
        process: rabbitmq
        surface: metrics
        path: /metrics

    # The management UI signs in through auth's OAuth issuer at its public host, which it
    # reaches through the edge like a browser, so it is no `dependsOn` edge. While the edge is
    # `legacy`, the route itself stays fleet-infra's IngressRoute.
    exposure:
      - name: management
        host: rabbitmq.jorisjonkers.dev
        audience: authenticated
        routes:
          - { path: /, match: prefix, process: rabbitmq, surface: management }

    processes:
      - name: rabbitmq
        lifecycle: application
        image: rabbitmq # rabbitmq:4.2-management-alpine
        runtime: none
        engine: rabbitmq

        provides:
          amqp: 5672
          management: 15672
          metrics: 15692 # the prometheus plugin's own listener

        placement:
          memory: 1Gi
          cpu: 200m

        # Erlang refuses a cookie file anyone but its owner can read, and the claim's fsGroup
        # makes every file on it group-readable at each mount, the cookie the old path left
        # there included. So HOME, where Erlang keeps its cookie, is this writable path
        # (env/rabbitmq/base.env), and each start writes a fresh cookie there, owner-only. A
        # single node is never clustered, so no other node needs to share it.
        writablePaths: [/tmp]

        probes:
          readiness: { tcp: 5672 }
          liveness: { tcp: 5672 }

        startupBudget: 200s # the live startup probe allows 40 checks 5s apart

        cutover: interrupted

        volumes:
          - claim: rabbitmq-data
            mountAt: /var/lib/rabbitmq
            size: 10Gi
            durability: recoverable

        assets:
          - from: config/rabbitmq.conf
            mountAt: /etc/rabbitmq/rabbitmq.conf
          - from: config/enabled_plugins
            mountAt: /etc/rabbitmq/enabled_plugins

        secrets:
          - path: secret/data/platform/rabbitmq
            keys: [rabbitmq.user, rabbitmq.password]
            access: read
            delivery: env
            rotation: { tolerates: restart }

  - id: platform-valkey
    observability:
      scrape:
        process: valkey
        surface: metrics
        path: /metrics

    processes:
      - name: valkey
        lifecycle: application
        image: valkey # valkey/valkey:8-alpine
        runtime: none

        provides:
          redis: 6379
          metrics: 9121 # the exporter sidecar's listener

        placement:
          memory: 768Mi
          cpu: 150m

        # The exporter's default address is redis://localhost:6379, the one the old path names.
        sidecars:
          - name: valkey-exporter
            image: valkey-exporter
            memory: 96Mi
            cpu: 25m

        probes:
          readiness: { tcp: 6379 }
          liveness: { tcp: 6379 }

        startupBudget: 30s

        cutover: interrupted

        # A cache: everything in it is rebuilt by its consumers.
        volumes:
          - claim: valkey-data
            mountAt: /data
            size: 5Gi
            durability: reconstructible

  # The estate's object store, with its volumes split at handover (decided 2026-10-27,
  # JorisJonkers-dev/deploy-kit#661): the metadata moves onto `garage-meta`, the data blocks
  # stay on the live `garage-data`, and Garage writes metadata snapshots onto
  # `garage-snapshots`, so the backup never reads the live LMDB database.
  - id: platform-garage
    observability:
      scrape:
        process: garage
        surface: admin
        path: /metrics

    processes:
      - name: garage
        lifecycle: application
        image: garage # dxflrs/garage:v2.3.0
        runtime: none
        engine: s3

        # `s3` is what a consumer's edge names; `admin` is the admin API the catalog method
        # applies the catalog over, and where Prometheus reads the metrics; `web` serves the
        # website buckets behind fleet-infra's assets route.
        provides:
          s3: 3900
          web: 3902
          admin: 3903

        # The live pod requests 256Mi and is limited at 1Gi.
        placement:
          memory: 1Gi
          cpu: 100m
          site: frankfurt

        probes:
          readiness: { path: /health, port: 3903 }
          liveness: { tcp: 3900 }

        startupBudget: 150s # the live startup probe allows 30 checks 5s apart

        cutover: interrupted

        assets:
          - from: config/garage.toml
            mountAt: /etc/garage.toml

        # The cluster secret and the admin token, from the document the old path reads them
        # from, under their live key names.
        secrets:
          - path: secret/data/platform/garage
            keys: [rpc_secret, admin_token]
            access: read
            delivery: env
            rotation: { tolerates: restart }

        volumes:
          - claim: garage-meta
            mountAt: /var/lib/garage/meta
            size: 2Gi
            durability: reconstructible # restored from the newest snapshot
          - claim: garage-snapshots
            mountAt: /var/lib/garage/snapshots
            size: 4Gi
            durability: recoverable
          # The live claim. Its data blocks are under `data/` on it, where the old path's
          # `data_dir` put them, so garage.toml names that directory.
          - claim: garage-data
            mountAt: /var/lib/garage/data
            size: 20Gi
            durability: recoverable

  # ========================================================== platform-mongo
  # Overleaf's document store: every project's text and every account. A replica set of one,
  # named `overleaf`, because Overleaf's transactions and change streams need one; the name is in
  # every connection string, and renaming a set means re-initiating it. Overleaf is its one
  # consumer, and names it in its own `dependsOn`.
  - id: platform-mongo
    processes:
      - name: mongo
        lifecycle: application
        image: mongo # mongo:8.0
        runtime: none
        # Keys the backup method, a dump over the wire protocol on the `mongo` surface, as the
        # user `backup` of `admin` from secret/data/data/mongo/backup. A mongo owns no databases,
        # so no edge into it derives a catalog.
        engine: mongo

        # The member is configured as this Process's Service name,
        # mongo.data-system.svc.cluster.local, which the pod resolves to itself (deploy-kit 0145).
        # Authentication is on, and the member authenticates as itself by the x.509 key and
        # self-signed certificate below, its own CA: mongod refuses a keyFile any group can
        # read, and the claim's fsGroup makes every mounted Secret group-readable. preferTLS
        # still takes its clients' plain connections, each signing in with its own login.
        # WiredTiger sizes its cache from the host's memory, not the container's, so it is set.
        args:
          - --replSet
          - overleaf
          - --bind_ip_all
          - --wiredTigerCacheSizeGB
          - "0.25"
          - --auth
          - --clusterAuthMode
          - x509
          - --tlsMode
          - preferTLS
          - --tlsCertificateKeyFile
          - /etc/mongo/membership.pem
          - --tlsCAFile
          - /etc/mongo/membership.pem
          - --tlsAllowConnectionsWithoutCertificates

        provides:
          mongo: 27017

        # The live pod's working set is about 280Mi, with a 1 GB cache and a 2Gi limit.
        # frankfurt-contabo-1 requests 17.8Gi of 23.5Gi before data's window adds about 4Gi.
        placement:
          memory: 1Gi
          cpu: 200m

        # mongod writes its socket under /tmp and its config database under /data/configdb.
        writablePaths: [/tmp, /data/configdb]

        probes:
          readiness: { tcp: 27017 }
          liveness: { tcp: 27017 }

        startupBudget: 120s # journal recovery after an unclean stop runs before the listener

        cutover: interrupted

        volumes:
          # The StatefulSet's claim, kept by name, so the handover adopts it in place.
          - claim: mongo-data-mongo-0
            mountAt: /data/db
            size: 20Gi
            durability: irreplaceable

        secrets:
          - path: secret/data/data/mongo/membership
            keys: [pem]
            access: read
            delivery: file
            mountAt: /etc/mongo/membership.pem
            fileMode: "0440"
            rotation: { tolerates: restart }
