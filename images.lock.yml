# The images lock: every image the platform's own projects and policies name,
# by digest, with the user it runs as (deploy-kit
# spec/v1/20-resolved-deployment.md#the-images-lock). The Platform fragment
# carries it beside platform.intent.yml; each application Project carries its
# own share in its fragment.
#
# Resolved on 2026-10-07: each tag is the image fleet-infra runs today, or,
# where fleet-infra runs none yet, the newest stable release, named as such.
# `uid` and `gid` are the image's own numeric user, read from the pushed
# image, or, where the image names its user or runs as root, the user it runs
# as under the restricted posture. `version` is the software inside the image,
# as its own release names it: the image's org.opencontainers.image.version
# label where it carries one, otherwise the tag or the version environment
# variable the pinned digest was resolved from (JorisJonkers-dev/workspace#140).
#
# The backup methods and the Vault policy job are built by
# JorisJonkers-dev/delivery, each release writing them into its images lock
# artifact; they are pinned here from delivery 0.9.2. The Platform document
# names them, and a fragment is never resolved from another Project's share,
# so this lock holds them rather than delivery's fragment.
apiVersion: lock.jorisjonkers.dev/v1
kind: ImagesLock
schemaVersion: 1.0.0
name: estate

