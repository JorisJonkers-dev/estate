# The images lock: every image the platform's own projects and policies name,
# by digest, with the user it runs as (deploy-kit
# spec/v1/20-resolved-deployment.md#the-images-lock). The Platform fragment
# carries it beside platform.intent.yml; each application Project carries its
# own share in its fragment.
#
# Resolved on 2026-10-07: each tag is the image fleet-infra runs today, or,
# where fleet-infra runs none yet, the newest stable release, named as such.
# `uid` and `gid` are the image's own numeric user, read from the pushed
# image, or, where the image names its user or runs as root, the user it runs
# as under the restricted posture.
#
# The backup methods and the Vault policy job are built by
# JorisJonkers-dev/delivery, each release writing them into its images lock
# artifact; they are pinned here from delivery 0.2.0. The Platform document
# names them, and a fragment is never resolved from another Project's share,
# so this lock holds them rather than delivery's fragment.
apiVersion: lock.jorisjonkers.dev/v1
kind: ImagesLock
schemaVersion: 1.0.0
name: estate

images:
  # traefik chart 41.4.0, which fleet-infra runs, ships v3.7.12. The image
  # runs as root by default; the chart runs it as 65532.
  traefik:
    repository: docker.io/library/traefik
    digest: "sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf"
    uid: 65532
    gid: 65532

  # 1.21.4, which fleet-infra runs. The image starts as root and drops to its
  # own `vault` user, uid 100 and gid 1000, which is what it runs as here.
  vault:
    repository: docker.io/hashicorp/vault
    digest: "sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569"
    uid: 100
    gid: 1000

  # Not run by fleet-infra yet: 0.162.0, the newest stable release.
  otel-collector:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    digest: "sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6"
    uid: 10001
    gid: 10001

  # v3.14.0-distroless, the prometheus kube-prometheus-stack 90.0.0 runs in
  # fleet-infra.
  prometheus:
    repository: quay.io/prometheus/prometheus
    digest: "sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a"
    uid: 65532
    gid: 65532

  # v0.1.0. Its image names its user (`liquibase`); this is that user's number
  # (JorisJonkers-dev/liquibase-runner#5 states it numerically in the image).
  liquibase-runner:
    repository: ghcr.io/jorisjonkers-dev/liquibase-runner
    digest: "sha256:f19a170f0285818c105939da633053b5800a7cc5d1efb4f2d8211e040bb134af"
    uid: 1001
    gid: 1001

  # Built by JorisJonkers-dev/delivery 0.2.0. Each runs as 65532:65532 by
  # number; the backup CronJob runs a method as its plan's uid and gid.
  vault-policy: # delivery 0.8.0, which also adopts a generated key's old value
    repository: ghcr.io/jorisjonkers-dev/delivery/vault-policy
    digest: "sha256:045513ab13ec373783d25d9314d91d4d8e6822f3bbed023316d0ae53af8737e6"
    uid: 65532
    gid: 65532
  file-backup:
    repository: ghcr.io/jorisjonkers-dev/delivery/file-backup
    digest: "sha256:765f128ca3fe06b9e6973fd042aca97af6c18fda01e338d3942c3149d0b12421"
    uid: 65532
    gid: 65532
  postgres-backup:
    repository: ghcr.io/jorisjonkers-dev/delivery/postgres-backup
    digest: "sha256:e55d680fe78d91819aa78a4175d0a5bccf48a1c211a126277c7ae34c1e207dbc"
    uid: 65532
    gid: 65532
  rabbitmq-backup:
    repository: ghcr.io/jorisjonkers-dev/delivery/rabbitmq-backup
    digest: "sha256:af8a5406def0c9e6b50e345f1c0dc33c0aae8188aa747cb033ae6f66aebca1e2"
    uid: 65532
    gid: 65532

  # The data and mail projects' images, resolved on 2026-10-15 as the digest
  # each live pod runs. fleet-infra still delivers both projects; these pin
  # what their fragments compose against until each is handed over. Where the
  # image starts as root and drops to its own user, the uid and gid are that
  # user's, read with `id` in the live container.
  postgres: # pgvector/pgvector:pg17
    repository: docker.io/pgvector/pgvector
    digest: "sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966"
    uid: 999
    gid: 999
  postgres-exporter: # v0.20.1, as `nobody`
    repository: quay.io/prometheuscommunity/postgres-exporter
    digest: "sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e"
    uid: 65534
    gid: 65534
  rabbitmq: # 4.2-management-alpine
    repository: docker.io/library/rabbitmq
    digest: "sha256:c7afed4c4ebebaea7fb32ac9d2db4c5ae1da8c535f13cf1fa0f77e3fa8a9959b"
    uid: 100
    gid: 101
  valkey: # 8-alpine
    repository: docker.io/valkey/valkey
    digest: "sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75"
    uid: 999
    gid: 1000
  valkey-exporter: # oliver006/redis_exporter v1.90.0-alpine, which names its user by number
    repository: docker.io/oliver006/redis_exporter
    digest: "sha256:136a6aac1258bcb41449272fe0de1d71e65f8cd69514efb2a410b2fd2239a3ba"
    uid: 59000
    gid: 59000
  stalwart: # v0.16.20
    repository: docker.io/stalwartlabs/stalwart
    digest: "sha256:74ca4f7f6885fe302f38a99381f36a208547afce1033d8734d9e6d8d3eba7446"
    uid: 2000
    gid: 2000
  # 0.4.2. Its image names no user, so it runs as root today; the handover
  # gives it one.
  stalwart-provisioner:
    repository: ghcr.io/jorisjonkers-dev/stalwart-provisioner
    digest: "sha256:124a9d73c246c1af9e52620b3ad337f28fb08c0faee0834450f6b572383b1b77"
    uid: 0
    gid: 0
