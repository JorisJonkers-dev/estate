# The delivery to production. It composes every participant's Intent Fragment
# with the pinned `deploy-kit compose`, publishes one signed Rendered artifact
# per Project whose render moved, and commits the moved pins: that commit is
# the deploy (deploy-kit spec/v1/55-delivery.md#rendered-artifacts-and-pins).
# It also commits a pin source composition rewrites while its pin stays, which
# deploys nothing (deploy-kit spec/v1/55-delivery.md#what-a-pin-source-holds).
# Its path and branch are the signer the Platform document names
# (bootstrap.flux.artifacts.signer), so Flux verifies every render against
# this workflow on main.
#
# Started by a fragment publish, through the dispatch App; the nightly
# schedule is a safety net for a dispatch that never arrived, not the primary
# path (deploy-kit spec/v1/60-setup.md#the-estate-repository).
#
# The file keeps its name, compose.yml, because its path on main is the
# identity every render is signed as: renaming it is a signer migration, not a
# rename. Everything a reader sees (the workflow, its runs, its jobs) names
# what it does instead: it delivers to the cluster `production`.
#
# Every run writes a job summary a human can review: one row per Project with
# the release it ran before, the release it runs now, whether its pin moved,
# and the codes of any Project composition refused. A run where composition
# isolated a Project fails, last, once everything else is delivered.
#
# The canary job stays beside composition until the first Project is delivered
# on the estate path (JorisJonkers-dev/home-portal#70): it proves the signature
# check end to end with one ConfigMap Flux fetches from
# ghcr.io/jorisjonkers-dev/render/canary.
name: Deliver to production
# The title says why the run started: a release, a rollback, a resume. The
# version a run actually delivers is composition's to decide, so it is in the
# job summary and the pin commit, not here.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Deliver to production: nightly safety net'
  || format('Deliver to production: {0}', inputs.reason || format('started by {0}', github.actor)) }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this delivery runs, shown as its title (delivery 0.4.0 released)
        required: false
        type: string
        default: ""
  schedule:
    - cron: "41 2 * * *" # safety net only; see above

permissions: {}

# One composition at a time: two runs would race on the previous lock. GitHub
# keeps one pending run per group, so a newer dispatch replaces an older one
# still waiting, which is harmless: each run composes main as it then stands.
concurrency:
  group: compose
  cancel-in-progress: false

env:
  REPOSITORY: ghcr.io/jorisjonkers-dev/render
  SIGNER_ISSUER: https://token.actions.githubusercontent.com
  SIGNER_SUBJECT: https://github.com/JorisJonkers-dev/estate/.github/workflows/compose.yml@refs/heads/main

jobs:
  canary:
    name: Publish the canary render
    # Only main signs as the identity Flux trusts; any other ref would sign as
    # an identity nothing verifies, so it does not publish at all. A dispatch
    # republishes it; the nightly run does not.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: 2.8.8

      # cosign 2.x, whose signature format the cluster's source-controller
      # verifies; cosign 3 defaults to the newer bundle format.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Render the canary
        run: |
          mkdir -p render
          cat > render/canary.yaml <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: estate-canary
            namespace: flux-system
            labels:
              app.kubernetes.io/managed-by: estate-compose
          data:
            commit: "${GITHUB_SHA}"
            run: "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EOF

      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the canary
        id: push
        run: |
          digest=$(flux push artifact "oci://${REPOSITORY}/canary:${GITHUB_SHA::12}" \
            --path=render \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="main@sha1:${GITHUB_SHA}" \
            --output=json | jq -r '.digest')
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "flux push returned no digest: '$digest'" >&2; exit 1 ;;
          esac

      - name: Sign the canary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REPOSITORY}/canary@${DIGEST}"

      # Composition verifies each artifact against the Platform document's
      # signer before it names it in a pin (deploy-kit
      # spec/v1/55-delivery.md#rendered-artifacts-and-pins), and so does the canary.
      - name: Verify the canary as Flux will
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${REPOSITORY}/canary@${DIGEST}" \
            --certificate-oidc-issuer="$SIGNER_ISSUER" \
            --certificate-identity="$SIGNER_SUBJECT" > /dev/null

      - name: Report the pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Canary published"
            echo
            echo "\`${REPOSITORY}/canary@${DIGEST}\`, signed and verified as \`${SIGNER_SUBJECT}\`."
            echo
            echo "Set \`spec.ref.digest\` in \`projects/_canary/source.yaml\` to \`${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Composition proper (deploy-kit spec/v1/examples/workflows/compose.yml,
  # adapted to this repository): pull every participant, run the pinned
  # `deploy-kit compose` once, publish the lock, publish and sign one artifact
  # per Project whose render moved, commit the moved pins and the pin sources
  # composition rewrote, and report.
  #
  # Every step that deploys runs only on main and only when every step before
  # it succeeded; the report runs whatever happened, so a failure still
  # reaches the commits and issues it concerns.
  compose:
    name: Deliver to production
    runs-on: ubuntu-latest
    # The Collector's key lives in the production environment alone, which only
    # main may use. Every run is one deployment to production: the pin commit is
    # the deploy.
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    env:
      OWNER: jorisjonkers-dev
      COMPOSED: ghcr.io/jorisjonkers-dev/composed
      PLATFORM_PROJECT: jorisjonkers.dev
      FRAGMENT_SIGNER: ^https://github\.com/JorisJonkers-dev/github-workflows/\.github/workflows/publish-fragment\.yml@
    steps:
      # The branch as it is when this run starts, not as it was when the run was
      # queued: runs wait on one another in the `compose` group, and one that
      # composed from the commit it was dispatched at would read the pins an
      # earlier run has since moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@jorisjonkers-dev"
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      # The one pin, toolkit.yml (deploy-kit spec/v1/60-setup.md#the-estate-repository).
      - name: Install the pinned toolkit
        id: toolkit
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          version="$(yq -er '."deploy-kit"' toolkit.yml)"
          npm install --no-save --ignore-scripts "@jorisjonkers-dev/deploy-kit@${version}"
          test "$(node -p "require('@jorisjonkers-dev/deploy-kit/package.json').version")" = "$version"
          integrity="$(node -p "require('./node_modules/.package-lock.json').packages['node_modules/@jorisjonkers-dev/deploy-kit'].integrity")"
          echo "integrity=${integrity}" >> "$GITHUB_OUTPUT"
          npx --no-install deploy-kit --help > /dev/null

      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull every participant, the previous lock and the pins
        id: pull
        run: |
          # No pin yet is an empty projects/, not a literal pattern.
          shopt -s nullglob

          # A fragment is read only by digest, only when publish-fragment signed
          # it, and only when the run that signed it was in the repository the
          # fragment names, which is this owner's: a fragment pushed by anything
          # else, or claiming another repository, never reaches composition.
          verify() { # verify <image@digest>: the signature, before anything is read
            cosign verify "$1" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "$FRAGMENT_SIGNER" \
              || { echo "::error::$1 is not signed by publish-fragment" >&2; exit 1; }
          }
          bound() { # bound <signatures> <directory>: the signer is the repository named
            local named
            named="$(yq '.metadata.repository' "$2/fragment.yml" | tr '[:upper:]' '[:lower:]')"
            # Checked before it is ever printed: a value from a fragment never
            # reaches a log line, where it could read as a workflow command.
            [[ "$named" =~ ^${OWNER}/[a-z0-9._-]+$ ]] \
              || { echo "::error::$(cat "$2/ref") names a repository outside ${OWNER}"; exit 1; }
            printf '%s' "$1" | jq -e --arg repository "$named" \
              '[.[].optional.githubWorkflowRepository // "" | ascii_downcase | . == $repository] | any' > /dev/null \
              || { echo "::error::$(cat "$2/ref") is not signed from ${named}, the repository it names"; exit 1; }
          }
          # Every failure exits explicitly: `latest` runs on the left of `||`,
          # where bash does not stop on an error by itself.
          fetch() { # fetch <image@digest> <directory>: verify, pull, record
            local signatures
            signatures="$(verify "$1")" || exit 1
            oras pull "$1" --output "$2" || { echo "::error::could not pull $1"; exit 1; }
            echo "$1" > "$2/ref"
            bound "$signatures" "$2"
          }
          latest() { # latest <image> <directory>: the release `latest` names
            local digest project version composed
            digest="$(oras resolve "$1:latest" 2>/dev/null)" || return 1
            fetch "$1@${digest}" "$2"
            # `latest` only moves forward when publish-fragment moves it, so a
            # release older than the one last composed is a tag moved back by
            # hand: it is not read, and the Project composes where it was.
            project="$(yq '.spec.project' "$2/fragment.yml")"
            version="$(yq '.spec.version' "$2/fragment.yml")"
            [[ "$project" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$ && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::$1@${digest} names no project or no release"; exit 1; }
            composed="$( { [ -f previous/lock.json ] && jq -r --arg p "$project" \
              '.spec.fragments[] | select(.project == $p) | .version' previous/lock.json; } || true)"
            # Releases are X.Y.Z alone, so a version sort orders them as semver does.
            [[ -z "$composed" || "$composed" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::the previous lock holds no release for ${project}"; exit 1; }
            if [ -n "$composed" ] && [ "$(printf '%s\n%s\n' "$composed" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "::error::$1@${digest} is ${project} ${version}, older than ${composed} the last composition read"
              rm -rf "$2"
              return 1
            fi
            # A fragment carries no time; when it was pushed is the registry's
            # record of the push (deploy-kit spec/v1/40-composition.md#participants).
            oras manifest fetch "$1@${digest}" \
              | jq -er '.annotations["org.opencontainers.image.created"]' > "$2/published" \
              || { echo "::error::$1@${digest} records no push time"; exit 1; }
          }

          # The previous lock and the commit it was composed at, from the
          # registry, read only as this workflow on main signed it: the signer
          # is this workflow's own, never one a fragment states. Absent only on
          # the very first composition.
          if digest="$(oras resolve "${COMPOSED}:latest" 2>/dev/null)"; then
            cosign verify "${COMPOSED}@${digest}" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" --certificate-identity "$SIGNER_SUBJECT" > /dev/null \
              || { echo "::error::${COMPOSED}@${digest} is not signed by composition"; exit 1; }
            oras pull "${COMPOSED}@${digest}" --output previous
            echo "lock=--lock previous/lock.json --lock-commit $(cat previous/COMMIT)" >> "$GITHUB_OUTPUT"
          fi

          # The Platform document is a participant like any Project, read at its
          # latest release, and only as this repository published it.
          latest "ghcr.io/${OWNER}/intent-${PLATFORM_PROJECT}" platform-fragment \
            || { echo "::error::the Platform document has never been published"; exit 1; }
          [ "$(yq '.metadata.repository' platform-fragment/fragment.yml)" = "$GITHUB_REPOSITORY" ] \
            || { echo "::error::the Platform document's fragment is not this repository's"; exit 1; }
          # Flux verifies against the signer the Platform document states; this
          # workflow signs as itself, so the two must be one identity.
          [ "$(yq '.bootstrap.flux.artifacts.signer.issuer' platform-fragment/platform.intent.yml)" = "$SIGNER_ISSUER" ] \
            && [ "$(yq '.bootstrap.flux.artifacts.signer.subject' platform-fragment/platform.intent.yml)" = "$SIGNER_SUBJECT" ] \
            || { echo "::error::the Platform document's signer is not this workflow on main"; exit 1; }

          mkdir -p fragments held
          for project in $(yq '.participants | keys | .[]' participants.yml); do
            [ "$project" = "$PLATFORM_PROJECT" ] && continue
            # A participant that published nothing is composition's to report,
            # E_PARTICIPANT_MISSING, not this step's.
            latest "ghcr.io/${OWNER}/intent-${project}" "fragments/${project}" \
              || echo "::warning::${project} has published no fragment"
          done

          # Every fragment the previous lock composed, and every one a Rollback
          # names, so an isolated Project composes at the fragment it last
          # composed at (deploy-kit spec/v1/40-composition.md#a-refused-project-is-isolated).
          # Each is held to the same signature as a fresh one.
          for ref in $( { [ -f previous/lock.json ] && jq -r '.spec.fragments[].ref' previous/lock.json
                          for source in projects/*/source.yaml; do
                            yq 'select(.kind == "OCIRepository") | .metadata.annotations["estate.jorisjonkers.dev/rollback-fragment"] // ""' "$source"
                          done; } | sort -u ); do
            [[ "$ref" =~ ^ghcr\.io/${OWNER}/intent-[a-z0-9.-]+@sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::${ref} is not a fragment of ${OWNER} by digest"; exit 1; }
            fetch "$ref" "held/$(printf '%s' "$ref" | sha256sum | cut -c1-12)"
          done

          # Each delivered Project's pin: the content hash its pinned artifact
          # carries, and the estate annotations on its source
          # (deploy-kit spec/v1/55-delivery.md#pause-and-rollback). _canary is
          # the bootstrap's proof, not an artifact composition publishes.
          echo '{}' > pins.json
          for source in projects/*/source.yaml; do
            project="$(basename "$(dirname "$source")")"
            [ "$project" = "_canary" ] && continue
            digest="$(yq 'select(.kind == "OCIRepository") | .spec.ref.digest' "$source")"
            # A source whose first publish never landed names no artifact.
            [ "$digest" = "sha256:$(printf '0%.0s' $(seq 64))" ] && continue
            # Where the artifact is published is what its own source pins,
            # never a name rebuilt here: the estate-scoped one sits beside the
            # Projects' repository, not below it.
            url="$(yq 'select(.kind == "OCIRepository") | .spec.url' "$source")"
            content="$(oras manifest fetch "${url#oci://}@${digest}" \
              | jq -er '.annotations["dev.jorisjonkers.content-hash"]')"
            annotations="$(yq -o=json 'select(.kind == "OCIRepository") | .metadata.annotations // {} | with_entries(select(.key | test("^estate\\.jorisjonkers\\.dev/")))' "$source")"
            # The release the pinned artifact labels its pods with, from its
            # unit's index; none moves the pin to an artifact that labels one
            # (deploy-kit spec/v1/55-delivery.md#rendered-artifacts-and-pins).
            pinned="pinned/${project}"
            oras pull "${url#oci://}@${digest}" --output "$pinned" > /dev/null \
              || { echo "::error::could not pull the pinned artifact of ${project}"; exit 1; }
            labelled=""
            if [ -f "${pinned}/apps/${project}/kustomization.yaml" ]; then
              labelled="$(yq '.patches[]? | select(.target.kind | test("Deployment")) | .patch' "${pinned}/apps/${project}/kustomization.yaml" \
                | yq '.spec.template.metadata.labels["app.kubernetes.io/version"] // ""')"
            fi
            jq --arg p "$project" --arg c "$content" --argjson a "$annotations" --arg l "$labelled" \
              '.[$p] = {contentHash: $c, annotations: $a, labelled: (if $l == "" then null else $l end)}' pins.json > pins.next
            mv pins.next pins.json
          done

      - name: Verify each package against its own manifest
        run: |
          for dir in platform-fragment fragments/*/ held/*/; do
            [ -f "${dir%/}/MANIFEST.sha256" ] || continue
            ( cd "$dir" && sha256sum --quiet -c MANIFEST.sha256 )
          done

      # A gate that has only ever passed is untested. Each negative fixture the
      # toolkit ships is otherwise valid, so it reaches the one invariant it
      # exists to trip; the check is on the code, not the exit status.
      - name: Prove the gate can fail, on the right error
        run: |
          examples=node_modules/@jorisjonkers-dev/deploy-kit/spec/v1/examples
          for fixture in duplicate-project:E_DUPLICATE_PROJECT \
                         duplicate-application-id:E_DUPLICATE_APPLICATION_ID \
                         duplicate-process-name:E_DUPLICATE_PROCESS_NAME \
                         duplicate-exposure-name:E_DUPLICATE_EXPOSURE_NAME \
                         duplicate-host:E_DUPLICATE_HOST \
                         unresolved-application:E_UNRESOLVED_APPLICATION \
                         unknown-surface:E_UNKNOWN_SURFACE \
                         dependency-cycle:E_DEPENDENCY_CYCLE; do
            set +e
            out="$(npx --no-install deploy-kit validate "$examples/platform/platform.intent.yml" \
              "$examples/delivery/" "$examples/edge/" "$examples/observability/" "$examples/secrets/" \
              "$examples/negative/${fixture%%:*}/" --json)"
            status=$?
            set -e
            [ "$status" -eq 1 ] || { echo "::error::${fixture%%:*}: the gate did not refuse (exit ${status})"; exit 1; }
            printf '%s' "$out" | jq -e --arg c "${fixture##*:}" 'map(.code) | index($c)' > /dev/null \
              || { echo "::error::${fixture%%:*}: refused, but not on ${fixture##*:}"; exit 1; }
          done

      - name: Compose
        id: compose
        env:
          LOCK: ${{ steps.pull.outputs.lock }}
          integrity: ${{ steps.toolkit.outputs.integrity }}
        run: |
          # What composition refused on, kept for the summary as well as the log.
          exec 2> >(tee refusal.txt >&2)
          # The union, every estate-wide invariant, isolation and the render, in
          # one run; only a refused Platform document, or an error no fragment
          # caused, exits 1 (deploy-kit spec/v1/40-composition.md#the-composition-run).
          # `--sources` hands it the committed pin sources, so it also writes the
          # source of a pin that stays where the committed one no longer says
          # what it derives (deploy-kit spec/v1/55-delivery.md#what-a-pin-source-holds).
          # shellcheck disable=SC2086 # LOCK is two options or none
          npx --no-install deploy-kit compose \
            --platform platform-fragment \
            --fragments fragments \
            --participants participants.yml \
            --held held \
            --pins pins.json \
            --sources projects \
            $LOCK \
            --cluster-state cluster-state.yml \
            --schema-package-integrity "$integrity" \
            --out composed

      - name: Publish the lock
        id: lock
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          git rev-parse HEAD > composed/COMMIT
          # Pushed untagged and tagged `latest` only once signed and verified: a
          # failed signing must not leave the next run an unsigned `latest`.
          digest="$(cd composed && oras push "${COMPOSED}" lock.json composition.json COMMIT \
            --format go-template='{{.digest}}')"
          # Signed as the renders are, so the next run reads only a lock this
          # workflow on main wrote.
          cosign sign --yes "${COMPOSED}@${digest}"
          cosign verify "${COMPOSED}@${digest}" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" --certificate-identity "$SIGNER_SUBJECT" > /dev/null
          # Read back by digest: an accepted push is not what a consumer reads.
          oras pull "${COMPOSED}@${digest}" --output check
          cmp check/lock.json composed/lock.json
          oras tag "${COMPOSED}@${digest}" latest
          [ "$(oras resolve "${COMPOSED}:latest")" = "$digest" ]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Publish one signed artifact per moved Project
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          LOCK_DIGEST: ${{ steps.lock.outputs.digest }}
        run: |
          render_hash="$(jq -r '.spec.composedDigest' composed/lock.json)"
          : > moved.txt
          # Each artifact is published where composition.json names it, which
          # is where its pin source points (deploy-kit
          # spec/v1/55-delivery.md#what-a-pin-source-holds): the estate-scoped
          # one beside the Projects' repository, since an OCI path component
          # cannot start with an underscore.
          for row in $(jq -r '.artifacts[] | select(.moves) | "\(.name)=\(.contentHash)=\(.repository)"' composed/composition.json); do
            project="${row%%=*}"
            rest="${row#*=}"
            content="${rest%%=*}"
            repository="${rest#*=}"
            # The digest comes from the push itself, never from a tag another
            # run could move in between.
            digest="$(cd "composed/artifacts/${project}" && oras push "${repository}:${content#sha256:}" \
              --annotation "dev.jorisjonkers.content-hash=${content}" \
              --annotation "dev.jorisjonkers.render-hash=${render_hash}" \
              --annotation "dev.jorisjonkers.lock-digest=${LOCK_DIGEST}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --format go-template='{{.digest}}' .)"
            cosign sign --yes "${repository}@${digest}"
            echo "${project} ${digest} ${repository}" >> moved.txt
          done

      # Verified the way Flux will: by digest, against the signer the Platform
      # document records, which the pull step held equal to this workflow's.
      - name: Verify each artifact as Flux will
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          while read -r project digest repository; do
            cosign verify "${repository}@${digest}" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              --certificate-identity "$SIGNER_SUBJECT" > /dev/null
            echo "verified ${project}@${digest}"
          done < moved.txt

      # One local commit: every moved pin, and every pin source composition
      # rewrote while its pin stays. Nothing is committed where it wrote
      # neither, and then no token is minted and nothing is pushed.
      - name: Commit the pin sources
        id: pins
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: bash .github/scripts/commit-pins.sh moved.txt composed/projects composed/composition.json

      # The Collector App pushes the commit: it alone holds contents: write on
      # this repository and bypasses main's ruleset (.github/rulesets/README.md).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pin-token
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.pins.outputs.committed == 'true' }}
        with:
          app-id: ${{ vars.ESTATE_COLLECTOR_APP_ID }}
          private-key: ${{ secrets.ESTATE_COLLECTOR_APP_PRIVATE_KEY }}

      - name: Push the pin commit
        id: push
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.pins.outputs.committed == 'true' }}
        env:
          TOKEN: ${{ steps.pin-token.outputs.token }}
        # A ClusterState capture that lands while this run composes is rebased
        # under the pin commit; any other change to main refuses the push.
        run: |
          sha="$(bash .github/scripts/push-pins.sh "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # The review copy of what this run did, whatever happened before it: a
      # composition that refused outright says what it refused on.
      - name: Summarize the delivery
        if: ${{ !cancelled() && (steps.compose.outcome == 'success' || steps.compose.outcome == 'failure') }}
        # A summary that cannot be written is a warning, never a failed delivery.
        continue-on-error: true
        env:
          BASE: ${{ github.sha }}
          DELIVERED: ${{ steps.push.outputs.sha }}
          PUBLISHED: ${{ github.ref == 'refs/heads/main' }}
          LOCK_DIGEST: ${{ steps.lock.outputs.digest }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/delivery-report.sh summary >> "$GITHUB_STEP_SUMMARY"

      # The same, as data, for the estate-dashboard's Composition page, which
      # reads each run's `composition` artifact (estate-dashboard#30). Like the
      # summary, a record that cannot be written is a warning, never a failed
      # delivery.
      - name: Record the delivery
        if: ${{ !cancelled() && (steps.compose.outcome == 'success' || steps.compose.outcome == 'failure') }}
        continue-on-error: true
        env:
          DELIVERED: ${{ steps.push.outputs.sha }}
          LOCK_DIGEST: ${{ steps.lock.outputs.digest }}
        run: |
          mkdir -p record
          bash .github/scripts/delivery-report.sh record > record/run.json
          jq -e . record/run.json > /dev/null
          for file in composed/lock.json composed/composition.json; do
            if [ -f "$file" ]; then cp "$file" record/; fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('record/run.json') != '' }}
        continue-on-error: true
        with:
          name: composition
          path: record/
          retention-days: 30
          if-no-files-found: error

      # The dispatch App reports a status on each publishing commit: it holds
      # statuses: write on every repository (deploy-kit spec/v1/60-setup.md#the-estate-repository).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: status-token
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('composed/composition.json') != '' }}
        with:
          app-id: ${{ vars.ESTATE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Report to each repository and the issues
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('composed/composition.json') != '' }}
        env:
          STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report.sh composed/composition.json

      # One GitHub Deployment per Project whose pin reached main, on the
      # repository that released it, as the dispatch App, which holds
      # deployments: write on every repository (deploy-kit spec/v1/55-delivery.md#rollouts).
      - name: Open a Deployment per moved Project
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.push.outputs.sha != '' }}
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ steps.status-token.outputs.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/deployments.sh composed/composition.json composed/lock.json

      # Last, so it never holds back what the steps above delivered: a Project
      # composition isolated (a refused, missing or stale fragment) turns the
      # run red, with one annotation per Project. compose-once.sh treats a run
      # that failed here alone as delivered. Keep the name: it matches on it.
      - name: Fail when a Project is refused
        if: ${{ !cancelled() && hashFiles('composed/lock.json') != '' }}
        run: bash .github/scripts/delivery-report.sh verdict
