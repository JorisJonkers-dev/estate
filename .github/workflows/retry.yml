# Retry one Project's release: record when it ran on the pin file, then start a
# composition, which renders that time onto the pod template of every gated
# Deployment, so Flagger analyses the pinned release once more and Flux never
# reverts it (deploy-kit spec/v1/55-delivery.md#pause-and-rollback). It is
# the way to try a failed release again; kubectl rollout restart is not, since
# Flux reverts the annotation it writes, which Flagger reads as a second release.
name: Retry

on:
  workflow_dispatch:
    inputs:
      project:
        description: The Project whose release to try again, as the participants list names it
        required: true
        type: string
      reason:
        description: Why, recorded in the commit
        required: true
        type: string

permissions: {}

# One hold edit at a time. A composition's pin commit may still land between
# the fetch and the push: hold.sh replays its edit on the newer main.
concurrency:
  group: hold
  cancel-in-progress: false

jobs:
  retry:
    name: Retry ${{ inputs.project }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Collector's key lives in the production environment alone, which only
    # main may use. This job holds a pin still or records a release; it deploys
    # nothing itself, so it records no deployment: the delivery it starts does.
    environment:
      name: production
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Collector App commits to the pin files: it alone holds contents:
      # write on this repository and bypasses main's ruleset
      # (.github/rulesets/README.md).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.ESTATE_COLLECTOR_APP_ID }}
          private-key: ${{ secrets.ESTATE_COLLECTOR_APP_PRIVATE_KEY }}

      - name: Record the Retry
        env:
          PROJECT: ${{ inputs.project }}
          ACTOR: ${{ github.actor }}
          REASON: ${{ inputs.reason }}
          PUSH_URL: https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}.git
        run: .github/scripts/hold.sh retry "$PROJECT"

      - name: Start a delivery
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
        run: gh workflow run compose.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="${PROJECT} retried"
