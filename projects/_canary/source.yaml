# The canary pin (JorisJonkers-dev/estate#1): proves the estate path end to
# end before any Project is on it. Flux fetches the canary Rendered artifact by
# digest, verifies its keyless signature against the composition workflow on
# main (the Platform document's bootstrap.flux.artifacts.signer), and applies
# one ConfigMap, flux-system/estate-canary, naming the commit and run that
# published it. JorisJonkers-dev/estate#2 removes this directory.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: canary
  namespace: flux-system
spec:
  interval: 10m0s
  url: oci://ghcr.io/jorisjonkers-dev/render/canary
  ref:
    digest: sha256:f69adb82e5af12a43531f65f6d8c289831d2dba4188f596d03714cb14074403b
  secretRef:
    name: render-pull
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/JorisJonkers-dev/estate/\.github/workflows/compose\.yml@refs/heads/main$
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: canary
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./
  prune: true
  sourceRef:
    kind: OCIRepository
    name: canary
