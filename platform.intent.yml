# Platform Intent: what the estate offers. The second authored document of the
# deploy-kit model, held to the same rule as a project file -- facts and
# policy, never mechanisms -- and published as an Intent Fragment by digest
# like any project (JorisJonkers-dev/deploy-kit spec/v1/14-platform-intent.md).
#
# This is the estate's own copy. It started as deploy-kit's worked example
# (spec/v1/examples/platform/platform.intent.yml), which stays there as the
# oracle the compiler is tested against; this file is the one the estate
# composes from, and it changes by pull request here.

apiVersion: intent.jorisjonkers.dev/v1
kind: Platform
schemaVersion: 1.0.0
owner: joris

metadata:
  cluster: production
  project: jorisjonkers.dev
  # The node contract this document is composed against, by digest: the
  # node-contract.yml beside it, which nix-config renders from its node files
  # (deploy-kit spec/v1/60-setup.md#node-facts). A contract that moves without
  # this digest moving is E_NODE_CONTRACT_MISMATCH.
  nodeContract: "sha256:be9cff298537a9625c68e91d52defae064c123d34964f214414a90c14a6d02aa"

# Facts about the cluster, named for what they are.
substrate:
  kubernetesVersion: v1.35.2+k3s1
  datastore: sqlite
  serverCount: 1
  secretsEncryption: true
  cni: flannel
  networkPolicyController: embedded # no non-enforcing stage: default-deny stays render-only
  clusterDns: kube-system
  # The slowest image pull a pod may wait on, which every derived deadline
  # allows on top of its own start: the Pis boot from USB sticks, and pulling
  # the Release Gate's image on enschede-pi-1 took 94s on 2026-10-14
  # (JorisJonkers-dev/deploy-kit#422). Larger images take longer there.
  imagePull: 5m

# What must exist before the first rendered object can apply.
bootstrap:
  flux:
    # The GitRepository that reads this repository, declared in fleet-infra's
    # flux-system while fleet-infra still owns the Flux controllers.
    sourceRef: flux-system/platform
    # Where each Project's render is published, one artifact per Project at
    # <repository>/<project>, and the keyless identity Flux verifies it
    # against: this repository's composition workflow on main.
    artifacts:
      repository: ghcr.io/jorisjonkers-dev/render
      signer:
        issuer: "https://token.actions.githubusercontent.com"
        subject: "https://github.com/JorisJonkers-dev/estate/.github/workflows/compose.yml@refs/heads/main"
      # The render packages are private: every pin source pulls with this
      # Secret, which the bootstrap wrote into flux-system for the canary.
      pullSecret: render-pull
  vault:
    unsealed: true
  crds:
    - traefik.io/v1alpha1
    - secrets.hashicorp.com/v1beta1
    - monitoring.coreos.com/v1
    - flagger.app/v1beta1 # the Canary every blue-green Process renders; bootstrap/cluster.sh applies it, Flagger's binary never does

# Where the edge terminates. A route's audience is the only way it reaches a tier.
tiers:
  - name: public-frankfurt
    audiences: [anonymous, authenticated]
    listener: tls
    certificates: acme
    forwardAuth: "http://auth-api.auth-system.svc.cluster.local:8081/api/auth/forward"
    traefik: edge/traefik-public # declared in platform/edge.project.yml, placed on the public-ingress node
  - name: lan
    audiences: [lan]
    listener: plain
    certificates: none
    traefik: edge/traefik-lan # placed on a LAN node

# One policy per Durability Class.
durability:
  reconstructible: {}
  recoverable:
    schedule: "15 3 * * *"
    retain: 14
  irreplaceable:
    schedule: "45 2 * * *"
    retain: 90
    # Contabo Object Storage, EU: an S3-compatible bucket off every node the
    # estate runs on. The credential holds the endpoint
    # (https://eu2.contabostorage.com), the bucket and the key pair.
    offCluster:
      destination: "s3://jorisjonkers-dev-backups"
      credential: secret/data/platform/backup/off-cluster
      # eu2.contabostorage.com resolved on 2026-10-07; a policy admits an
      # address range, never a hostname, so a move of the endpoint is a change
      # here.
      egress:
        - { cidr: 185.219.143.84/32, port: 443 }
        - { cidr: 185.219.143.85/32, port: 443 }

# Directories several projects share, on the node that holds them (deploy-kit
# spec/v1/14-platform-intent.md#libraries). /srv/media is the btrfs media disk on
# enschede-t1000-1, owned deploy:deploy (gid 1000, nix-config's deployUser), as
# Samba writes it too.
libraries:
  media:
    node: enschede-t1000-1
    path: /srv/media
    gid: 1000
    grants:
      immich: write
      arr: write
      jellyfin: read
      qbittorrent: write
  # Torrents still downloading, and seeding once done: a directory of its own on
  # the same node, which only the download client writes.
  seeding:
    node: enschede-t1000-1
    path: /srv/media-incomplete
    gid: 1000
    grants:
      qbittorrent: write

# What a Process that requires a GPU is handed, by the vendor of its card
# (deploy-kit spec/v1/14-platform-intent.md#gpus): one time-sliced share of the
# resource nvidia's device plugin advertises, under the `nvidia-cdi` runtime
# class fleet-infra's apps-core installs, whose handler reads the CDI spec
# NixOS writes on each nvidia node.
gpus:
  nvidia:
    resource: nvidia.com/gpu
    runtimeClass: nvidia-cdi

# The VPN every attached Process's traffic leaves through (deploy-kit
# spec/v1/14-platform-intent.md#vpn): gluetun on ProtonVPN WireGuard, on
# Netherlands servers that forward a port. The credential's one key,
# WIREGUARD_PRIVATE_KEY, works for every Proton server. The MTU fits the pod's
# flannel path over tailscale (1230) less WireGuard's 60 bytes. The outbound
# subnets are what the tunnel's kill switch still lets out directly: the
# tailnet, the home LAN, the spare private range, and the cluster's pod and
# Service ranges, so an attached Process reaches the estate's own Services.
# Cluster DNS stays the pod's resolver, so public lookups leave outside the
# tunnel; their answers' traffic does not.
vpn:
  image: gluetun
  credential: secret/data/platform/vpn
  memory: 256Mi
  cpu: 100m
  settings:
    VPN_SERVICE_PROVIDER: protonvpn
    VPN_TYPE: wireguard
    WIREGUARD_MTU: "1170"
    SERVER_COUNTRIES: Netherlands
    PORT_FORWARD_ONLY: "on"
    FIREWALL_OUTBOUND_SUBNETS: "100.64.0.0/10,192.168.0.0/16,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
    DOT: "off"
    DNS_KEEP_NAMESERVER: "on"
    UPDATER_PERIOD: 24h
    HEALTH_VPN_DURATION_INITIAL: 30s
    TZ: Europe/Amsterdam

# The method is the image: one purpose-built image per engine, resolved
# through the images lock. Nothing executable is authored.
# An engine whose method dumps over the network names the surface it connects
# to; one whose method reads the volume alone names none.
engines:
  # `catalog` applies the database catalog of the estate path's projects
  # (deploy-kit spec/v1/14-platform-intent.md#catalog-methods).
  postgres: { backup: postgres-backup, surface: postgres, catalog: postgres-catalog }
  rabbitmq: { backup: rabbitmq-backup, surface: management }
  files: { backup: file-backup }

# One cadence for every rendered monitor.
monitors:
  interval: 30s
  timeout: 10s

# The collector every exporting Runtime Profile sends to, and the metrics
# stack every declared scrape surface admits: both declared in
# platform/observability.project.yml.
telemetry:
  collector: observability/otel-collector
  metrics: observability/prometheus

# The Secret Store every grant is read from: declared in platform/secrets.project.yml.
secretStore: secrets/vault

# One posture for every container the estate renders.
hardening: restricted

# One cadence for every rendered probe.
probes:
  period: 10s
  timeout: 5s
  failures: 3

# The ephemeral default for a declared writable path.
ephemeral:
  size: 64Mi

# The migration runner: one system for the estate, Liquibase with YAML changelogs.
migration:
  runner: liquibase-runner
  deadline: 10m
  memory: 256Mi
  cpu: 100m

# How a release is switched. The machinery performs the switch and is never
# switched by it. Flagger, the Release Gate and the Reporter are Applications
# of the `delivery` Project, which JorisJonkers-dev/delivery publishes as its
# own fragment, so this document validates only beside that project file:
# validated alone it refuses E_UNKNOWN_MACHINERY, E_UNKNOWN_RELEASE_GATE and
# E_UNKNOWN_REPORTER.
delivery:
  machinery: [edge/traefik-public, edge/traefik-lan, delivery/flagger, delivery/release-gate]
  gate: delivery/release-gate
  # Writes each Rollout's stages to its GitHub Deployment, from Flux's events
  # and its own reads (deploy-kit spec/v1/55-delivery.md#rollouts). Naming it
  # renders the Provider and Alert that send it Flux's events, and admits
  # Flux's notification controller to its `http` surface.
  reporter: delivery/reporter
  analysis:
    interval: 30s
    iterations: 4
    threshold: 3
    # A check fails when more than this share of the Canary's requests errors,
    # or when one is slower than this. Every release is held to both.
    errorRate: 1%
    latency: 500ms

# The Applications whose Processes may hold Kubernetes API access, and where
# the API server answers. Each is in the delivery Project, save the
# estate-dashboard, which reads Flux's sources and units and Flagger's Canaries
# and writes nothing (JorisJonkers-dev/estate-dashboard). This document
# validates only beside its fragment: alone it refuses E_UNKNOWN_API_HOLDER.
apiAccess:
  holders: [delivery/flagger, delivery/release-gate, delivery/collector, delivery/reporter, estate-dashboard/estate-dashboard]
  server:
    - { cidr: 10.43.0.1/32, port: 443 } # Service default/kubernetes, read 2026-10-07

# The job that writes every rendered Vault policy and role into the Secret
# Store. Its role, and the role's binding to the job's ServiceAccount
# (vault-policy in Vault's namespace: data-system while `secrets` is legacy,
# see handover.serving below), are created by bootstrap/cluster.sh: the
# job cannot grant itself the privilege to write policies.
policyJob:
  image: vault-policy
  role: policy-admin
  memory: 64Mi
  cpu: 10m
  # Successful runs take 54 to 89 seconds, most of it starting the
  # container; 120s left no margin on a slow node, and one attempt past it
  # failed the Job and every estate-path unit behind it.
  deadline: 5m

# Which delivery path each Project is on while the estate moves off
# fleet-infra's deploy/production branch, one Project at a time
# (deploy-kit spec/v1/60-setup.md#handing-over-one-project-at-a-time).
# Every Project fleet-infra still delivers is named under `legacy`, so its
# project file is read rather than refused as E_HANDOVER_UNLISTED. `delivery`
# was never on the old path: its Applications (the Release Gate, Flagger, the
# Collector) are born on the estate path, and so is `estate-dashboard`.
# `data` moved last (JorisJonkers-dev/homelab-collections#15): its Postgres
# applies its own catalog now, with the admin login under
# secret/data/data/postgres/catalog, so its `serving` location went with it,
# and with that location the estate-scoped artifact's last unit. A
# Project that retires leaves the ledger: `knowledge` was retired with the old
# knowledge stack (fleet-infra#495), and `knowledge-platform` and `media` were
# split into the Projects that now run their apps under `estate`.
handover:
  retireBy: 2027-03-31
  legacy:
    - edge
    - secrets
    - observability
    - auth
    - agents
    - mail
    - utility
  estate:
    - delivery
    - estate-dashboard
    - home-portal
    - tribelt
    - grimoire
    - findability-explorer
    - outline
    - overleaf
    - hindsight
    - karakeep
    - immich
    - arr
    - jellyfin
    - jellyseerr
    - qbittorrent
    - prowlarr
    - n8n
    - data
  # Where the old path runs a legacy Application that the estate path
  # reaches, rather than where its declaration puts it
  # (deploy-kit spec/v1/14-platform-intent.md#handover-ledger). Live Vault is
  # data-system/vault-0, not secrets-system: without this, the Vault policy
  # job renders into a namespace that does not exist and every unit after it
  # waits. A statement goes in the change that hands its Project over.
  serving:
    - application: vault
      namespace: data-system

# No `providers`: everything an Application depends on today runs in the
# cluster and is declared by some Project. The worked example's `stalwart`
# provider is the mail Project's Application here.
